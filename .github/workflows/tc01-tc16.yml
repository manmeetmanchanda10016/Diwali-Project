name: Common Tensor Tests TC01-TC50

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "include/minitensor/**"
      - "src/**"
      - "tests/test_common_tc01_tc16.cpp"
      - "tests/test_common_tc17_tc50.cpp"
      - ".github/workflows/tc01-tc16.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/minitensor/**"
      - "src/**"
      - "tests/test_common_tc01_tc16.cpp"
      - "tests/test_common_tc17_tc50.cpp"
  workflow_dispatch:

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMINITENSOR_ENABLE_LTO=OFF

      - name: Build all targets
        run: cmake --build build --parallel 2

      - name: Run all CTest suites
        run: ctest --test-dir build --output-on-failure

      - name: Upload TC01-TC50 raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc01-tc50-results
          path: |
            build/tc01_tc16_results.csv
            build/tc17_tc50_results.csv
          if-no-files-found: warn
